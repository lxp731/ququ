<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>蛐蛐 - 语音输入</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      overflow: hidden;
      user-select: none;
      pointer-events: none;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }
    #overlay {
      cursor: grab;
      display: flex;
      flex-direction: column;
      max-width: 600px;
      min-width: 200px;
      margin: 0 20px;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 10px 16px;
      transition: opacity 0.5s ease, transform 0.5s ease;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: auto;
    }
    #overlay.visible {
      opacity: 1;
      transform: translateY(0);
    }
    #overlay:active {
      cursor: grabbing;
    }
    /* Three dots — visual hint that the window is draggable */
    #drag-handle {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 16px;
      flex-shrink: 0;
    }
    .gripper {
      display: flex;
      gap: 4px;
    }
    .gripper-dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
    }
    /* Status bar */
    #status-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-bottom: 6px;
      flex-shrink: 0;
    }
    #record-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #818cf8;
      flex-shrink: 0;
    }
    #record-dot.pulse {
      animation: pulse-dot 1.5s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    #status-label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 0.5px;
    }
    /* Text zones */
    #text-container {
      font-size: 15px;
      line-height: 1.7;
      word-break: break-all;
      min-height: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
    }
    #text-container .green {
      color: rgba(163, 230, 53, 0.90);
    }
    #text-container .yellow {
      color: rgba(251, 191, 36, 0.85);
    }
    #text-container .red {
      color: rgba(248, 113, 113, 0.78);
    }
    #cursor {
      display: inline-block;
      width: 2px;
      height: 16px;
      background: rgba(255, 255, 255, 0.50);
      vertical-align: text-bottom;
      margin-left: 1px;
    }
    #cursor.blink {
      animation: blink-cursor 0.8s step-end infinite;
    }
    @keyframes blink-cursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    #placeholder {
      color: rgba(255, 255, 255, 0.18);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <div id="drag-handle">
      <div class="gripper">
        <div class="gripper-dot"></div>
        <div class="gripper-dot"></div>
        <div class="gripper-dot"></div>
      </div>
    </div>
    <div id="status-bar">
      <div id="record-dot" class="pulse"></div>
      <span id="status-label">正在聆听...</span>
    </div>
    <div id="text-container">
      <span id="placeholder">正在聆听...</span>
    </div>
    <div id="cursor" class="blink"></div>
  </div>

  <script>
    (function () {
    /* check if electronAPI is available */
    if (!window.electronAPI) {
      document.getElementById('placeholder').textContent = 'API 不可用';
      document.getElementById('status-label').textContent = 'electronAPI 缺失';
      return;
    }

    var greenEl = null;
    var yellowEl = null;
    var redEl = null;
    var cursorEl = document.getElementById('cursor');
    var placeholderEl = document.getElementById('placeholder');
    var container = document.getElementById('text-container');
    var recordDot = document.getElementById('record-dot');
    var statusLabel = document.getElementById('status-label');
    var overlayEl = document.getElementById('overlay');

    function clearZones() {
      if (greenEl) { greenEl.remove(); greenEl = null; }
      if (yellowEl) { yellowEl.remove(); yellowEl = null; }
      if (redEl) { redEl.remove(); redEl = null; }
      cursorEl.classList.remove('blink');
    }

    function updateDOM(green, yellow, red) {
      clearZones();

      var hasContent = (green || '') + (yellow || '') + (red || '') !== '';

      if (!hasContent) {
        placeholderEl.style.display = '';
        cursorEl.classList.remove('blink');
        recordDot.classList.add('pulse');
        statusLabel.textContent = '正在聆听...';
        return;
      }

      placeholderEl.style.display = 'none';
      recordDot.classList.add('pulse');
      statusLabel.textContent = '正在聆听...';

      if (green) {
        greenEl = document.createElement('span');
        greenEl.className = 'green';
        greenEl.textContent = green;
        container.appendChild(greenEl);
      }
      if (yellow) {
        yellowEl = document.createElement('span');
        yellowEl.className = 'yellow';
        yellowEl.textContent = yellow;
        container.appendChild(yellowEl);
      }
      if (red) {
        redEl = document.createElement('span');
        redEl.className = 'red';
        redEl.textContent = red;
        container.appendChild(redEl);
      }

      if (red) cursorEl.classList.add('blink');
      else cursorEl.classList.remove('blink');
    }

    /* JS-based window drag (no -webkit-app-region, so focusable:false works) */
    var dragging = false, dragSX = 0, dragSY = 0;

    overlayEl.addEventListener('mousedown', function (e) {
      dragging = true;
      dragSX = e.screenX;
      dragSY = e.screenY;
      e.preventDefault();
    });

    window.addEventListener('mousemove', function (e) {
      if (!dragging) return;
      var dx = e.screenX - dragSX;
      var dy = e.screenY - dragSY;
      dragSX = e.screenX;
      dragSY = e.screenY;
      window.electronAPI.moveFloatingWindow(dx, dy);
    });

    window.addEventListener('mouseup', function () {
      dragging = false;
    });

    /* Listen for preedit updates from main process */
    window.electronAPI.onFloatingPreedit(function (data) {
      updateDOM(data.green, data.yellow, data.red);
    });

    /* Hover detection: 鼠标在悬浮窗上时不自动消失 */
    var isHovered = false, hideDeferred = false;

    overlayEl.addEventListener('mouseenter', function () { isHovered = true; });
    overlayEl.addEventListener('mouseleave', function () {
      isHovered = false;
      if (hideDeferred) {
        hideDeferred = false;
        overlayEl.classList.remove('visible');  // 开始 0.5s 淡出
        recordDot.classList.remove('pulse');
        statusLabel.textContent = '';
      }
    });

    /* Listen for visibility changes */
    window.electronAPI.onFloatingVisibility(function (visible) {
      if (visible) {
        hideDeferred = false;
        overlayEl.classList.add('visible');
      } else {
        if (isHovered) {
          // 鼠标在窗口上 → 暂缓消失，关掉录音指示
          hideDeferred = true;
          recordDot.classList.remove('pulse');
          statusLabel.textContent = '拖拽调整位置';
        } else {
          overlayEl.classList.remove('visible');
        }
      }
    });
    })();
  </script>
</body>
</html>
