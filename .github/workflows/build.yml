name: Build & Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 质量门禁: 前端 lint + 测试 (PR 必跑) ──
  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Node.js dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Lint
        run: cd frontend && pnpm lint

      - name: Test
        run: cd frontend && pnpm test

  # 注: 后端不在 CI 中构建/发布 — 用户通过容器自行运行 (docker compose up)。
  # 因此不设后端 job (避免安装 torch/funasr 等 2GB+ 依赖或触发模型下载)。

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [frontend-quality]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfuse2 dpkg fakeroot rpm

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Node.js dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Build renderer
        run: cd frontend && pnpm run build:renderer

      - name: Build Linux (AppImage + deb + rpm)
        run: cd frontend && npx electron-builder --linux AppImage deb rpm --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Set artifact info
        id: artifact
        run: |
          VERSION=$(node -p "require('./frontend/package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ququ-linux
          path: |
            frontend/release/ququ-v*.AppImage
            frontend/release/ququ-v*.deb
            frontend/release/ququ-v*.rpm
          retention-days: 7

  build-macos:
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/Library/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Node.js dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Build renderer
        run: cd frontend && pnpm run build:renderer

      - name: Build macOS (dmg + zip)
        run: cd frontend && npx electron-builder --mac dmg zip --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: ququ-macos
          path: |
            frontend/release/ququ-v*.dmg
            frontend/release/ququ-v*.zip
          retention-days: 7

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Node.js dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Build renderer
        run: cd frontend && pnpm run build:renderer

      - name: Build Windows portable
        run: cd frontend && npx electron-builder --win portable --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: ququ-windows-portable
          path: frontend/release/ququ-v*.exe
          retention-days: 7

  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./frontend/package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: ququ-linux
          path: dist/

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: ququ-macos
          path: dist/
        continue-on-error: true

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: ququ-windows-portable
          path: dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "ququ v${{ steps.version.outputs.version }}"
          body: |
            ## 蛐蛐 QuQu ${{ steps.version.outputs.version }}

            ### 下载
            | 平台 | 文件 | 说明 |
            |------|------|------|
            | 🐧 Linux | `ququ-v${{ steps.version.outputs.version }}.AppImage` | AppImage（通用 Linux）|
            | 🐧 Linux | `ququ-v${{ steps.version.outputs.version }}.deb` | deb 包（Debian/Ubuntu/Mint）|
            | 🐧 Linux | `ququ-v${{ steps.version.outputs.version }}.rpm` | rpm 包（Fedora/RHEL/CentOS）|
            | 🍎 macOS | `ququ-v${{ steps.version.outputs.version }}.dmg` | macOS 安装包 |
            | 🍎 macOS | `ququ-v${{ steps.version.outputs.version }}.zip` | macOS 免安装版 |
            | 🪟 Windows | `ququ-v${{ steps.version.outputs.version }}.exe` | 免安装便携版 |

            ### 安装
            ```bash
            # deb（推荐 Ubuntu/Debian 用户）
            sudo dpkg -i ququ-v${{ steps.version.outputs.version }}.deb

            # rpm（Fedora/RHEL 用户）
            sudo rpm -i ququ-v${{ steps.version.outputs.version }}.rpm

            # AppImage（其他 Linux 发行版）
            chmod +x ququ-v${{ steps.version.outputs.version }}.AppImage && ./ququ-v${{ steps.version.outputs.version }}.AppImage
            ```

            ### 使用前准备（容器化后端）

            首次使用需启动 FunASR 后端容器，详见 [README](https://github.com/lxp731/ququ#readme)。

            ### 校验
            详见 `checksums.txt`

            🤖 Generated with [Claude Code](https://claude.com/claude-code)
          files: |
            dist/ququ-v*.AppImage
            dist/ququ-v*.deb
            dist/ququ-v*.rpm
            dist/ququ-v*.dmg
            dist/ququ-v*.zip
            dist/ququ-v*.exe
            dist/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
