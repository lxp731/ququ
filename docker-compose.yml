services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ququ-backend:latest
    container_name: ququ-backend
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      # 挂载主机模型缓存目录，避免重复下载（~1.2GB）
      - ${HOME}/.cache/modelscope:/models
    environment:
      # 清除宿主机注入的代理变量（避免容器内联网失败）
      http_proxy: ""
      https_proxy: ""
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      no_proxy: ""
      NO_PROXY: ""
      # 以下变量已在 Dockerfile 中设置默认值，如需覆盖取消注释
      # MODELSCOPE_CACHE: "/custom/path"
      # OMP_NUM_THREADS: "8"
      # QUQU_TMP_DIR: "/var/tmp"
    restart: unless-stopped
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 600s
