services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ququ-backend:latest
    container_name: ququ-backend
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      # 挂载主机模型缓存目录，避免重复下载（~1.2GB）
      - ${HOME}/.cache/modelscope:/models
    environment:
      # 清除宿主机注入的代理变量（避免容器内联网失败）
      http_proxy: ""
      https_proxy: ""
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      no_proxy: ""
      NO_PROXY: ""
      # gunicorn 线程数（用于排队等待，不影响并发转写能力）
      # FUNASR_THREADS: "8"
      # PyTorch 推理时，使用 CPU 并行核心数
      # OMP_NUM_THREADS: "4"
    restart: unless-stopped
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 600s
