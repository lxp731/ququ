services:
  ququ:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ququ-backend:latest
    container_name: ququ
    userns_mode: "keep-id:uid=1000,gid=1000"
    volumes:
      # 挂载主机模型缓存目录，避免重复下载
      - ${HOME}/.cache/modelscope:/models
    environment:
      # 清除宿主机注入的代理变量
      http_proxy: ""
      https_proxy: ""
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      no_proxy: ""
      NO_PROXY: ""
      # PyTorch 推理时 CPU 并行核心数
      # OMP_NUM_THREADS: "4"
      # 设备选择 (auto 自动检测 GPU, 或 cpu / cuda)
      # FUNASR_DEVICE: "auto"
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - ququ
    restart: unless-stopped
    mem_limit: 5g
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 600s

networks:
  ququ:
    name: ququ
    driver: bridge