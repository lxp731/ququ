services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ququ-backend:latest
    volumes:
      # 挂载主机模型缓存目录，避免重复下载（~1.2GB + streaming ~200MB + SenseVoice ~450MB）
      - ${HOME}/.cache/modelscope:/models
    environment:
      # 清除宿主机注入的代理变量
      http_proxy: ""
      https_proxy: ""
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      no_proxy: ""
      NO_PROXY: ""
      # PyTorch 推理时 CPU 并行核心数
      # OMP_NUM_THREADS: "4"
      # 设备选择 (auto 自动检测 GPU, 或 cpu / cuda)
      # FUNASR_DEVICE: "auto"
    restart: unless-stopped
    mem_limit: 5g
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 600s

  nginx:
    image: docker.io/library/nginx:alpine
    ports:
      - "0.0.0.0:8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
